<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkup - Museum Items</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="checkup.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
<div class="container">
<header class="header">
  <div class="header-left">
    <h1>Museum table</h1>
    <span class="subtitle">View your museum and progress in more detail.</span>
  </div>
  <div class="header-right">
    <img id="headerAvatar" src="https://vzge.me/head/51/Guest" alt="Header Minecraft Skin" class="image-pixelated">
    <div id="headerUsername">Guest</div>
  </div>
</header>



<nav>
  <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="museum.html">Museum</a></li>
    <li><a href="checkup.html">Checkup</a></li>
    <li><a href="profile.html">Profile</a></li>
    <span id="navUnderline"></span>
  </ul>
</nav>


  <div class="controls">
    <input type="text" id="usernameInput" placeholder="Enter username" />
    <button id="checkBtn">Check</button>
    <input type="search" id="searchInput" placeholder="Search by ID" />
    <button id="clearSearchBtn">Clear Search</button>
    <button id="clearLocalStorageBtn">Clear localStorage</button>
  </div>


	<div class="filters">
	  <button id="btn-total">Total (0)</button>
	  <button id="btn-donated">Donated (0)</button>
	  <button id="btn-missing">Missing (0)</button>

	  <!-- Job filter dropdown -->
	  <select id="jobFilter">
		<option value="">All Jobs</option>
		<option value="__NO_JOB__">No Job</option>
	  </select>
	</div>



  <table>
    <colgroup>
      <col>
      <col>
      <col>
      <col>
    </colgroup>
    <thead>
      <tr>
        <th>ID</th>
        <th>Rarity</th>
        <th>Level</th>
        <th>Category</th>
      </tr>
    </thead>
    <tbody id="results">
      <tr><td colspan="4"></td></tr>
    </tbody>
  </table>

  <div class="pagination">
    <button id="prevPage" disabled>Previous</button>
    <span id="pageInfo">Page 1</span>
    <button id="nextPage">Next</button>
  </div>

<!-- Modal -->
<div class="modal-overlay" id="itemModal">
  <div class="modal">
    <div class="modal-header">
      <!-- Left: item image + name -->
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <img id="modalHeaderImage" src="" alt="Item" style="width:40px; height:40px; object-fit:contain; border-radius:4px;">
        <h2 id="modalTitle" style="margin:0;"></h2>
      </div>

      <!-- Right: calculator image + close button -->
      <div style="display:flex; align-items:center; gap:0.5rem;">
        <a id="calculatorLink" target="_blank" title="Open in Calculator">
  <img id="calculatorIcon" src="pictures/calculator.svg" alt="Calculator" width="32" height="32">
</a>

        <button class="modal-close" id="modalClose">&times;</button>
      </div>
    </div>

    <div class="modal-body">
      <div class="job-rarity">
  <div class="job-info">
    <strong>Job:</strong>
    <span id="modalJob"></span>
  </div>
  <img id="modalRarity" src="" alt="Rarity" title="Rarity" />
</div>

      <div class="ingredients">
        <div><strong>Ingredients:</strong></div>
        <div id="modalIngredients" style="margin-top:4px; display:flex; flex-direction:column; gap:4px;"></div>
      </div>
    </div>
  </div>
</div>

</div>

  <script src="checkup.js"></script>
</body>
</html>
