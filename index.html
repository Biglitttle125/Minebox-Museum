<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minebox Home</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <header class="header">
    <div class="header-left">
      <h1>
        <img src="pictures/skills/museum.png" alt="Museum Icon" class="title-icon">
        Minebox Museum
      </h1>
      <span class="subtitle">Track your progress, explore items, and manage your profile.</span>
    </div>
  </header>

  <div class="card-container">
<div class="card" data-link="/Minebox-Museum/museum/museum.html">
      <img src="pictures/skills/museum.png" alt="Museum">
      <h2>Museum</h2>
      <p>View and explore your donated collections.</p>
    </div>

<div class="card" data-link="/Minebox-Museum/checkup/checkup.html">
      <img src="pictures/skills/enchanted-museum.gif" alt="Checkup">
      <h2>Checkup</h2>
      <p>View your museum and progress in more detail.</p>
    </div>

<div class="card" data-link="/Minebox-Museum/profile/profile.html">
      <img src="https://vzge.me/head/50/Guest" alt="Profile">
      <h2>Profile</h2>
      <p>View your player profile and playerstats.</p>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
